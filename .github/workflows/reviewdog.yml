name: reviewdog

on:
  pull_request:
    types: [ opened, synchronize ]

# set empty default permissions and define them explicitly in each job for security
permissions: {}

jobs:

  markdown-lint:
    name: runner / markdown-lint
    runs-on: ubuntu-latest

    permissions:
      contents: read        # actions/checkout
      pull-requests: write  # reviewdog github-pr-review reporter posts review comments

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdown-lint
        uses: reviewdog/action-markdownlint@584c3e89347d0b16ede47c73ae199550a02b1b37 # v0.33.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          markdownlint_flags: '**/*.md --ignore LICENSE.md --disable MD013 --' # disable line length rule
